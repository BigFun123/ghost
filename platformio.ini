; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
; ESP32-S3-WROOM-1 N16R8: quad flash, octal PSRAM.
board_build.partitions = partitions_esp32s3_16mb.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    bblanchon/ArduinoJson @ ^7.4.2
; Force Hardware CDC Mode 1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

[env:esp32-s3-devkitc-1_ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = ghost-controller.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
extra_scripts = pre:scripts/resolve_ota_host.py

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    bblanchon/ArduinoJson @ ^7.4.2

[env:nodemcuv2_ota]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
upload_protocol = espota
upload_port = ghost-controller.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
extra_scripts = pre:scripts/resolve_ota_host.py
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    bblanchon/ArduinoJson @ ^7.4.2
